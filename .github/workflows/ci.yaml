name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Run tests
        run: python3 .github/scripts/run_tests.py
